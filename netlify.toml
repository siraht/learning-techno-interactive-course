[build]
  command = "bun run build:netlify"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  BUN_VERSION = "1.3.14"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/course/*"
  to = "/course/:splat/index.html"
  status = 200
